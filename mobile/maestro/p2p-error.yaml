appId: com.dubbridge.mobile
name: P2P dashboard retryable errors
tags:
  - android
  - p6-t3d
  - p2p
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 20000
- runFlow: e2e-login.yaml
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 20000

- tapOn:
    id: home-open-my-content
- extendedWaitUntil:
    visible:
      id: my-content-error
    timeout: 20000
- assertVisible:
    id: my-content-error-retry
- takeScreenshot: 27_p2p_my_content_error
- scrollUntilVisible:
    element:
      id: my-content-back
    direction: DOWN
    timeout: 5000
- tapOn:
    id: my-content-back

- tapOn:
    id: home-open-invites
- extendedWaitUntil:
    visible:
      id: invites-error
    timeout: 20000
- assertVisible:
    id: invites-error-retry
- takeScreenshot: 28_p2p_invites_error
