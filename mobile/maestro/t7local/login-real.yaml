appId: com.dubbridge.mobile
name: T7local real login
tags:
  - android
  - s-230
  - t7local
---
- tapOn:
    id: login-email-input
- setClipboard: ${T7LOCAL_EMAIL}
- pasteText

- tapOn:
    id: login-password-input
- setClipboard: ${T7LOCAL_PASSWORD}
- pasteText

- assertVisible:
    id: login-submit-button
    enabled: true

# Submit through the password field's native IME action instead of depending on
# a first post-keyboard tap, which Android consumes in this emulator path.
- pressKey: Enter

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 20000
