name: p4-t1-r1-bundle

on:
  push:
    branches:
      - feature/p2p-mvp-core
    paths:
      - ".github/workflows/p4-t1-r1-bundle.yml"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Generate Bare worklet
        run: npm run build:bare-worklet
        working-directory: mobile
      - name: Upload generated worklet
        uses: actions/upload-artifact@v4
        with:
          name: p4-t1-r1-worklet
          path: mobile/src/p2p/runtime/worklet.bundle.js
          if-no-files-found: error
