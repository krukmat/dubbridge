name: p4-t1-r1-bundle

on:
  push:
    branches:
      - feature/p2p-mvp-core
    paths:
      - ".github/workflows/p4-t1-r1-bundle.yml"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Generate Bare worklet
        run: npm run build:bare-worklet
        working-directory: mobile
      - name: Upload generated worklet
        uses: actions/upload-artifact@v4
        with:
          name: p4-t1-r1-worklet
          path: mobile/src/p2p/runtime/worklet.bundle.js
          if-no-files-found: error

      - name: Commit generated worklet and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/p2p/runtime/worklet.bundle.js
          git rm .github/workflows/p4-t1-r1-bundle.yml
          git commit -m "build(p4): regenerate T1-r1 worklet bundle"
          git push origin HEAD:feature/p2p-mvp-core
