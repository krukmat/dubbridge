name: p4-t1-r1-refresh-worklet

on:
  push:
    branches:
      - feature/p2p-mvp-core
    paths:
      - ".github/workflows/p4-t1-r1-refresh-worklet.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Regenerate and verify Bare worklet
        run: |
          npm run build:bare-worklet
          npm run check:bare-worklet
        working-directory: mobile
      - name: Commit regenerated bundle and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/src/p2p/runtime/worklet.bundle.js
          git rm .github/workflows/p4-t1-r1-refresh-worklet.yml
          git commit -m "build(p4): refresh bare worklet bundle"
          git push origin HEAD:feature/p2p-mvp-core
