name: Temporary sync main into Devstral migration branch

on:
  push:
    branches:
      - feat/devstral-128k-migration

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[sync-main]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/devstral-128k-migration
          fetch-depth: 0

      - name: Merge current main and resolve expected overlap
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [[ -n "$conflicts" ]]; then
            if [[ "$conflicts" != "scripts/gemma_local.py" ]]; then
              echo "Unexpected merge conflicts:" >&2
              echo "$conflicts" >&2
              exit 1
            fi
            git checkout --ours scripts/gemma_local.py
          elif [[ $merge_rc -ne 0 ]]; then
            echo "Merge failed without a resolvable conflict" >&2
            exit "$merge_rc"
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/gemma_local.py')
          text = path.read_text(encoding='utf-8')

          if 'MODEL_NUM_CTX_OVERRIDES = {' not in text:
              anchor = '''MODEL_NUM_PREDICT_OVERRIDES = {\n    "gemma4:26b-a4b-it-qat": 8192,\n}\n'''
              if anchor not in text:
                  raise SystemExit('num_predict override anchor missing')
              text = text.replace(anchor, anchor + 'MODEL_NUM_CTX_OVERRIDES = {}\n', 1)
          else:
              start = text.index('MODEL_NUM_CTX_OVERRIDES = {')
              end = text.index('}\n', start) + 2
              text = text[:start] + 'MODEL_NUM_CTX_OVERRIDES = {}\n' + text[end:]

          if 'def resolve_num_ctx(' not in text:
              anchor = '''def resolve_num_predict(model, num_predict):\n    """Return the effective generation budget for a specific model.\n\n    Callers that pass a non-default value keep that explicit override. The\n    shared 4096-token default stays unchanged for models without an override.\n    """\n    if num_predict != DEFAULT_NUM_PREDICT:\n        return num_predict\n    return MODEL_NUM_PREDICT_OVERRIDES.get(model, DEFAULT_NUM_PREDICT)\n'''
              if anchor not in text:
                  raise SystemExit('resolve_num_predict anchor missing')
              resolve_ctx = '''\n\ndef resolve_num_ctx(model, num_ctx):\n    """Return the effective context window for a specific model.\n\n    Explicit caller overrides win. MODEL_NUM_CTX_OVERRIDES remains available\n    for future model-specific host constraints; the active stack currently\n    uses explicit role profiles instead of a Muse-specific override.\n    """\n    if num_ctx != DEFAULT_NUM_CTX:\n        return num_ctx\n    return MODEL_NUM_CTX_OVERRIDES.get(model, DEFAULT_NUM_CTX)\n'''
              text = text.replace(anchor, anchor + resolve_ctx, 1)

          if 'effective_num_ctx = resolve_num_ctx(model, num_ctx)' not in text:
              text = text.replace(
                  '    effective_num_predict = resolve_num_predict(model, num_predict)\n',
                  '    effective_num_predict = resolve_num_predict(model, num_predict)\n'
                  '    effective_num_ctx = resolve_num_ctx(model, num_ctx)\n',
                  1,
              )
          text = text.replace('            "num_ctx": num_ctx,', '            "num_ctx": effective_num_ctx,', 1)

          if 'muse-glimmer' in text.lower() or 'muse glimmer' in text.lower():
              raise SystemExit('Muse reference reintroduced into active gemma_local.py')

          path.write_text(text, encoding='utf-8')
          PY

          git add scripts/gemma_local.py
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

      - name: Validate synchronized branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile scripts/gemma_local.py scripts/gemma-code-review.py scripts/peer-workflow-review.py
          python scripts/gemma_local_test.py
          python scripts/reviewer_model_binding_test.py
          python scripts/gemma_code_review_test.py
          python scripts/peer_workflow_review_test.py
          python scripts/local-agent/run_local_task_test.py
          python scripts/local-agent/run_med_high_task_test.py
          ! grep -RniE 'muse[- _]glimmer' scripts Makefile docs/playbooks/AGENT_WORKFLOW_GUIDE.md

      - name: Commit synchronized branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "merge: sync main into Devstral migration branch [sync-main]"
          git push origin HEAD:feat/devstral-128k-migration
