name: Temporary local model stack migration v2

on:
  push:
    branches:
      - feat/devstral-128k-migration

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[model-stack-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/devstral-128k-migration
          fetch-depth: 0

      - name: Resolve pinned Qwen3.6 manifest digest
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/qwen-manifest.json \
            https://registry.ollama.ai/v2/library/qwen3.6/manifests/27b-q4_K_M
          digest="$(sha256sum /tmp/qwen-manifest.json | awk '{print $1}')"
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not resolve full qwen3.6:27b-q4_K_M manifest digest" >&2
            exit 1
          fi
          if [[ "$digest" != 3a40c32f1450* ]]; then
            echo "Unexpected Qwen digest: $digest" >&2
            cat /tmp/qwen-manifest.json >&2
            exit 1
          fi
          echo "QWEN_ARCHITECT_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Apply model-role migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          ROOT = Path('.')
          MUSE_TAG = 'muse-glimmer:30b-q4_K_M'
          GPT_TAG = 'gpt-oss:20b'
          QWEN_TAG = 'qwen3.6:27b-q4_K_M'
          QWEN_DIGEST = os.environ['QWEN_ARCHITECT_DIGEST']
          OLD_MUSE_DIGEST = 'de878ce33ad81d060001db1469a02eebe4d86f0ad58cfe52dc062fdcbe4464c1'

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def require(text, needle, path):
              if needle not in text:
                  raise SystemExit(f'{path}: required anchor not found: {needle!r}')

          # Remove Muse literals from every active script/config first.
          for root in (Path('scripts'), Path('Makefile')):
              paths = [root] if root.is_file() else [p for p in root.rglob('*') if p.is_file()]
              for path in paths:
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  text = text.replace(MUSE_TAG, GPT_TAG)
                  text = text.replace('Muse Glimmer', 'GPT-OSS 20B')
                  text = text.replace('muse-glimmer', 'gpt-oss')
                  text = text.replace('muse_glimmer', 'gpt_oss')
                  path.write_text(text, encoding='utf-8')

          # Local Architect is deliberately Qwen3.6, not GPT-OSS.
          for p in ('scripts/local-architect/run_analysis.py',
                    'scripts/local-architect/run_analysis_test.py',
                    'scripts/local-architect/adr037_handoff_mapping.py',
                    'scripts/local-architect/adr037_handoff_mapping_test.py'):
              text = read(p)
              text = text.replace(GPT_TAG, QWEN_TAG)
              text = text.replace('GPT-OSS 20B', 'Qwen3.6 27B')
              text = text.replace('gpt-oss', 'qwen3.6')
              text = text.replace(OLD_MUSE_DIGEST, QWEN_DIGEST)
              write(p, text)

          # Shared Ollama transport/reviewer binding.
          p = 'scripts/gemma_local.py'
          text = read(p)
          require(text, f'DEFAULT_REVIEW_MODEL = "{GPT_TAG}"', p)
          text = re.sub(
              r'# ADR-036 Amendment 2 / owner directive 2026-08-11: the RRI 0-25 primary\n'
              r'(?:#.*\n)+?DEFAULT_REVIEW_MODEL = "gpt-oss:20b"\n',
              '# Reviewer binding (2026-08-31): GPT-OSS 20B is the lightweight independent reviewer.\n'
              'DEFAULT_REVIEW_MODEL = "gpt-oss:20b"\n'
              'DEFAULT_REVIEW_NUM_CTX = 65536\n'
              'DEFAULT_REVIEW_REASONING_EFFORT = "medium"\n',
              text,
              count=1,
          )
          if 'DEFAULT_REVIEW_NUM_CTX = 65536' not in text:
              raise SystemExit(f'{p}: failed to install GPT-OSS reviewer constants')
          text = re.sub(
              r'# C4 \(docs/audit/2026-08-19-gpt-oss-think-flag-not-honored\.md\):.*?'
              r'THINK_DIRECTIVE_TEXT = "/no_think"\n',
              '# GPT-OSS uses native Ollama reasoning levels; no text-level /no_think workaround is needed.\n'
              'GPT_OSS_MODEL_PREFIX = "gpt-oss"\n'
              'GPT_OSS_REASONING_LEVELS = {"low", "medium", "high"}\n'
              'THINK_DIRECTIVE_MODELS = set()\n'
              'THINK_DIRECTIVE_TEXT = "/no_think"\n',
              text,
              count=1,
              flags=re.S,
          )
          if 'GPT_OSS_MODEL_PREFIX = "gpt-oss"' not in text:
              # The historical comment may differ; replace only the old special-case set.
              text = text.replace(
                  'THINK_DIRECTIVE_MODELS = {"gpt-oss:20b"}\nTHINK_DIRECTIVE_TEXT = "/no_think"',
                  'GPT_OSS_MODEL_PREFIX = "gpt-oss"\n'
                  'GPT_OSS_REASONING_LEVELS = {"low", "medium", "high"}\n'
                  'THINK_DIRECTIVE_MODELS = set()\n'
                  'THINK_DIRECTIVE_TEXT = "/no_think"',
                  1,
              )
          if 'GPT_OSS_MODEL_PREFIX = "gpt-oss"' not in text:
              raise SystemExit(f'{p}: failed to replace legacy think workaround')

          anchor = '''def resolve_num_predict(model, num_predict):\n    """Return the effective generation budget for a specific model.\n\n    Callers that pass a non-default value keep that explicit override. The\n    shared 4096-token default stays unchanged for models without an override.\n    """\n    if num_predict != DEFAULT_NUM_PREDICT:\n        return num_predict\n    return MODEL_NUM_PREDICT_OVERRIDES.get(model, DEFAULT_NUM_PREDICT)\n'''
          require(text, anchor, p)
          if 'def resolve_think_setting(' not in text:
              text = text.replace(anchor, anchor + '''\n\ndef resolve_think_setting(model, think):\n    """Resolve Ollama thinking control without invalid GPT-OSS booleans."""\n    if isinstance(model, str) and model.startswith(GPT_OSS_MODEL_PREFIX):\n        if isinstance(think, str) and think in GPT_OSS_REASONING_LEVELS:\n            return think\n        return DEFAULT_REVIEW_REASONING_EFFORT\n    return think\n\n\ndef resolve_keep_alive(model):\n    """Keep GPT-OSS warm briefly while avoiding long model overlap on 32 GB hosts."""\n    if isinstance(model, str) and model.startswith(GPT_OSS_MODEL_PREFIX):\n        return "1m"\n    return "10m"\n''', 1)
          text = text.replace('"think": think,', '"think": resolve_think_setting(model, think),', 1)
          text = text.replace('"keep_alive": "10m",', '"keep_alive": resolve_keep_alive(model),', 1)

          get_json_anchor = '''def get_json(url, timeout):\n    request = urllib.request.Request(url, method="GET")\n    try:\n        with urllib.request.urlopen(request, timeout=timeout) as response:\n            return json.loads(response.read().decode("utf-8"))\n    except (TimeoutError, socket.timeout) as exc:\n        raise GemmaIdleTimeout(timeout) from exc\n'''
          require(text, get_json_anchor, p)
          if 'def unload_model(' not in text:
              text = text.replace(get_json_anchor, get_json_anchor + '''\n\ndef unload_model(host, model, timeout):\n    """Best-effort unload of a currently resident Ollama model."""\n    try:\n        payload = get_json(endpoint(host, "/api/ps"), timeout)\n        loaded = {\n            item.get("name") or item.get("model")\n            for item in payload.get("models", [])\n            if isinstance(item, dict)\n        }\n        if model not in loaded:\n            return False\n        data = json.dumps({"model": model, "keep_alive": 0, "stream": False}).encode("utf-8")\n        request = urllib.request.Request(\n            endpoint(host, "/api/generate"),\n            data=data,\n            headers={"Content-Type": "application/json"},\n            method="POST",\n        )\n        with urllib.request.urlopen(request, timeout=timeout) as response:\n            response.read()\n        return True\n    except Exception as exc:\n        print(f"[local-model] warning: could not unload {model!r}: {exc}", file=sys.stderr)\n        return False\n''', 1)
          write(p, text)

          # Generic code-review runner: GPT-OSS reviewer profile and evidence grounding.
          p = 'scripts/gemma-code-review.py'
          text = read(p)
          text = text.replace('Run a read-only local Gemma code review over a pre-built packet.',
                              'Run a read-only local code review over a pre-built packet.')
          text = text.replace('Send a read-only code review packet to local Ollama/Gemma.',
                              'Send a read-only code review packet to a local Ollama reviewer.')
          text = text.replace('You are Gemma Reviewer for DubBridge. You are read-only.',
                              'You are DubBridge Reviewer. You are read-only and evidence-bound.')
          text = text.replace(
              'Review the supplied packet and diff. Do not approve, modify files, ',
              'Review only the supplied packet and diff. Every finding must cite supplied code evidence. '
              'Do not infer unseen files or behavior. If evidence is insufficient, omit the finding. '
              'Do not approve, modify files, ',
          )
          text = text.replace('str(gemma_local.DEFAULT_NUM_CTX)', 'str(gemma_local.DEFAULT_REVIEW_NUM_CTX)')
          write(p, text)

          # Band-routed reviewer: Gemma primary -> GPT-OSS 20B second reviewer -> D14.
          p = 'scripts/peer-workflow-review.py'
          text = read(p)
          text = text.replace('_run_gpt_oss_fallback', '_run_gpt_oss_fallback')
          text = text.replace('glimmer_result', 'gpt_oss_result')
          text = text.replace('glimmer_error', 'gpt_oss_error')
          text = text.replace('glimmer_fallback', 'gpt_oss_fallback')
          text = text.replace('qwen_result', 'primary_result')
          text = text.replace('qwen_error', 'primary_error')

          old_header = '''def _run_gpt_oss_fallback(packet: str, phase: str, args) -> Tuple[Optional[dict], Optional[str]]:\n'''
          require(text, old_header, p)
          start = text.index(old_header)
          end = text.index('\n\ndef run_qwen_band_review', start)
          new_fn = '''def _run_gpt_oss_fallback(packet: str, phase: str, args) -> Tuple[Optional[dict], Optional[str]]:\n    """Run the lightweight evidence-bound GPT-OSS second-review profile."""\n    review_args = argparse.Namespace(**vars(args))\n    review_args.num_ctx = gemma_local.DEFAULT_REVIEW_NUM_CTX\n    review_args.temperature = 0.0\n    review_args.think = gemma_local.DEFAULT_REVIEW_REASONING_EFFORT\n    gemma_local.unload_model(args.host, args.qwen_model, args.idle_timeout)\n    last_error = None\n    for _ in range(2):\n        try:\n            result = run_local_structured_review(\n                packet,\n                phase,\n                review_args,\n                model=gemma_local.DEFAULT_REVIEW_MODEL,\n                reviewer=gemma_local.DEFAULT_REVIEW_MODEL,\n            )\n        except (gemma_local.GemmaIdleTimeout, gemma_local.GemmaWallTimeout, RuntimeError) as exc:\n            last_error = str(exc)\n            gemma_local.unload_model(args.host, gemma_local.DEFAULT_REVIEW_MODEL, args.idle_timeout)\n            continue\n        gemma_local.unload_model(args.host, gemma_local.DEFAULT_REVIEW_MODEL, args.idle_timeout)\n        if result["verdict"] == "blocked":\n            last_error = "gpt-oss reviewer returned BLOCKED"\n            continue\n        return result, None\n    return None, last_error or "gpt-oss reviewer unavailable"\n'''
          text = text[:start] + new_fn + text[end:]

          text = text.replace(
              'Review the supplied diff and acceptance criteria for correctness, '
              'fail-closed behavior, missing tests, and side effects.\\n',
              'Review only the supplied diff and acceptance criteria for correctness, '
              'fail-closed behavior, missing tests, and side effects. '
              'Every finding must be supported by supplied code evidence; do not infer unseen files or behavior.\\n',
          )
          text = text.replace('GPT-OSS 20B as the intermediate fallback before D14',
                              'GPT-OSS 20B as the lightweight independent second reviewer before D14')
          write(p, text)

          # Local Architect: Qwen3.6 27B Q4_K_M, 64K, think=false, no residency.
          p = 'scripts/local-architect/run_analysis.py'
          text = read(p)
          text = text.replace('_BOUNDARY_BUDGET_NUM_CTX = 8192', '_BOUNDARY_BUDGET_NUM_CTX = 65536')
          text = text.replace('default=8192,\n        help="Ollama context window size',
                              'default=65536,\n        help="Ollama context window size', 1)
          text = text.replace(OLD_MUSE_DIGEST, QWEN_DIGEST)
          # In case the prior generic pass already changed the old digest comment but not value.
          text = re.sub(
              r'default="[0-9a-f]{64}",\n        help="Expected Ollama digest for the exact model tag\."',
              f'default="{QWEN_DIGEST}",\n        help="Expected Ollama digest for the exact model tag."',
              text,
              count=1,
          )
          if '"keep_alive": 0,' not in text:
              text = text.replace('"stream": False,', '"stream": False,\n        "keep_alive": 0,', 1)
          write(p, text)

          # Keep Local Architect tests synchronized to exact digest and 64K defaults.
          p = 'scripts/local-architect/run_analysis_test.py'
          text = read(p)
          text = text.replace(OLD_MUSE_DIGEST, QWEN_DIGEST)
          text = text.replace('de878ce33ad81d060001db1469a02eebe4d86f0ad58cfe52dc062fdcbe4464c1', QWEN_DIGEST)
          # Update only explicit default-context assertions/fixtures when present.
          text = text.replace('num_ctx=8192', 'num_ctx=65536')
          text = text.replace('self.assertEqual(config.num_ctx, 8192)', 'self.assertEqual(config.num_ctx, 65536)')
          write(p, text)

          # Add focused regression tests without weakening existing suites.
          Path('scripts/reviewer_model_binding_test.py').write_text('''import importlib.util\nimport os\nimport sys\nimport unittest\n\nSCRIPTS = os.path.dirname(os.path.abspath(__file__))\nif SCRIPTS not in sys.path:\n    sys.path.insert(0, SCRIPTS)\nimport gemma_local\n\nPEER = os.path.join(SCRIPTS, "peer-workflow-review.py")\nspec = importlib.util.spec_from_file_location("peer_workflow_review_binding", PEER)\npeer = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(peer)\n\nclass ReviewerBindingTest(unittest.TestCase):\n    def test_gpt_oss_is_reviewer_binding(self):\n        self.assertEqual(gemma_local.DEFAULT_REVIEW_MODEL, "gpt-oss:20b")\n        self.assertEqual(gemma_local.DEFAULT_REVIEW_NUM_CTX, 65536)\n        self.assertEqual(gemma_local.DEFAULT_REVIEW_REASONING_EFFORT, "medium")\n\n    def test_gpt_oss_boolean_think_resolves_to_medium_reasoning(self):\n        payload = gemma_local.build_chat_payload(\n            model="gpt-oss:20b", system_prompt="s", packet="p",\n            num_ctx=65536, num_predict=128, temperature=0.0, think=False,\n        )\n        self.assertEqual(payload["think"], "medium")\n        self.assertEqual(payload["options"]["num_ctx"], 65536)\n        self.assertEqual(payload["keep_alive"], "1m")\n\n    def test_moderate_second_reviewer_is_gpt_oss(self):\n        self.assertTrue(hasattr(peer, "_run_gpt_oss_fallback"))\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          # Authoritative guide: GPT-OSS for reviewer slots; Qwen3.6 for architect/refinement.
          p = 'docs/playbooks/AGENT_WORKFLOW_GUIDE.md'
          text = read(p)
          text = text.replace(MUSE_TAG, GPT_TAG)
          text = text.replace('Muse Glimmer', 'GPT-OSS 20B')
          text = text.replace('muse-glimmer', 'gpt-oss')
          lines = []
          for line in text.splitlines():
              lowered = line.lower()
              if ('local architect' in lowered or 'architect-refined' in lowered or
                  'advisory refinement' in lowered or 'refinement (`go_local`' in lowered):
                  line = line.replace(GPT_TAG, QWEN_TAG).replace('GPT-OSS 20B', 'Qwen3.6 27B')
              lines.append(line)
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          if 'muse-glimmer' in text.lower() or 'muse glimmer' in text.lower():
              raise SystemExit(f'{p}: active Muse reference survived migration')
          write(p, text)

          # Append-only binding history.
          p = 'docs/audit/agent-workflow-binding-history.md'
          text = read(p)
          row = ('| 2026-08-31 | Active local stack rebinding | Reviewer slots previously held by Muse Glimmer -> '
                 '`gpt-oss:20b` (64K, medium reasoning); Local Architect / Complex Analyst -> '
                 '`qwen3.6:27b-q4_K_M` (64K, think=false). Muse Glimmer retired from the active stack; historical rows retained. |\n')
          if row not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += row
          write(p, text)

          # ADR-044 records role split while preserving historical ADRs.
          adr = Path('docs/adr/ADR-044-local-model-reviewer-and-architect-rebinding.md')
          if not adr.exists():
              adr.write_text(f'''---\ntype: ADR\nstatus: Accepted\ndate: 2026-08-31\n---\n\n# ADR-044 — Local reviewer and architect rebinding\n\n## Decision\n\nRetire Muse Glimmer from every active DubBridge role.\n\n- Local implementer RRI 0–25 remains `qwen3.8:27b-mlx`.\n- Local implementer RRI 26–45 remains `devstral-small-2:24b-instruct-2512-q4_K_M`.\n- Reviewer slots previously occupied by Muse Glimmer use `gpt-oss:20b`.\n- The GPT-OSS reviewer profile uses 64K context, `medium` reasoning effort, temperature 0 for the second-review path, and evidence-bound findings only.\n- Local Architect / Complex Analyst uses `{QWEN_TAG}` with 64K context, temperature 0, `think=false`, and exact manifest digest `{QWEN_DIGEST}`.\n- Review model transitions unload the prior large local model before loading the next reviewer, and GPT-OSS is released after its second-review attempt, minimizing simultaneous residency on a 32 GB host.\n- Muse Glimmer is not an automatic fallback for any active role. Historical ADR/audit references are retained as historical truth.\n\n## Rationale\n\nThe 30B Muse binding leaves insufficient host-memory headroom during review and architecture workloads on the target 32 GB MacBook. GPT-OSS 20B provides an independent, smaller reviewer, while Qwen3.6 27B Q4_K_M provides a dedicated repository-reasoning model for the advisory architect role without coupling architecture to the implementation model.\n\n## Unchanged\n\nRRI boundaries, cloud escalation, D14 adjudication, implementation repair budgets, reviewer independence requirements, and Devstral/Qwen3.8 implementation responsibilities are unchanged.\n''', encoding='utf-8')

          p = 'docs/adr/README.md'
          text = read(p)
          if 'ADR-044-local-model-reviewer-and-architect-rebinding.md' not in text:
              if not text.endswith('\n'):
                  text += '\n'
              text += '- [ADR-044 — Local reviewer and architect rebinding](ADR-044-local-model-reviewer-and-architect-rebinding.md) — Accepted 2026-08-31\n'
          write(p, text)

          # Fail closed if Muse survives in active executable/config/authoritative surfaces.
          active_roots = [Path('scripts'), Path('docs/playbooks/AGENT_WORKFLOW_GUIDE.md'), Path('Makefile')]
          survivors = []
          for root in active_roots:
              paths = [root] if root.is_file() else [p for p in root.rglob('*') if p.is_file()]
              for path in paths:
                  try:
                      t = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if 'muse-glimmer' in t.lower() or 'muse glimmer' in t.lower():
                      survivors.append(str(path))
          if survivors:
              raise SystemExit('Active Muse references remain: ' + ', '.join(sorted(set(survivors))))
          PY

      - name: Validate changed Python and focused reviewer/architect tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/gemma_local.py \
            scripts/gemma-code-review.py \
            scripts/peer-workflow-review.py \
            scripts/local-architect/run_analysis.py \
            scripts/reviewer_model_binding_test.py
          python scripts/reviewer_model_binding_test.py
          python scripts/gemma_local_test.py
          python scripts/peer_workflow_review_test.py
          python scripts/gemma_code_review_test.py
          python scripts/local-architect/run_analysis_test.py
          python scripts/local-architect/adr037_handoff_mapping_test.py

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No migration changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: retire Muse from active local model stack [model-stack-migration]"
          git push origin HEAD:feat/devstral-128k-migration
