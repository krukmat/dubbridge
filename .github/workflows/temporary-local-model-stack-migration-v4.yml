name: Temporary local model stack migration v4

on:
  push:
    branches:
      - feat/devstral-128k-migration

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[model-stack-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/devstral-128k-migration
          fetch-depth: 0

      - name: Reuse validated v3 transformation
        shell: bash
        run: |
          set -euo pipefail
          git show 9b83366de737733dfe7eb630b0b30a92349839c9:.github/workflows/temporary-local-model-stack-migration-v3.yml > /tmp/v3.yml
          python - <<'EXTRACT'
          from pathlib import Path
          import textwrap
          source = Path('/tmp/v3.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          Path('/tmp/model_stack_migrate.py').write_text(textwrap.dedent(source[start:end]), encoding='utf-8')
          EXTRACT
          python /tmp/model_stack_migrate.py

      - name: Update Low-band D14 test mocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/peer_workflow_review_test.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if rri <= 25:\n            patches.append(\n                patch.object(\n                    _mod,\n                    "_run_gemma_fallback",\n                    return_value=(None, "gemma unavailable"),\n                )\n            )\n            patches.append(patch.object(_mod, "run_d14_fallback", return_value=result))\n'''
          new = '''        if rri <= 25:\n            patches.append(\n                patch.object(\n                    _mod,\n                    "_run_gpt_oss_review",\n                    return_value=(None, "gpt-oss unavailable"),\n                )\n            )\n            patches.append(\n                patch.object(\n                    _mod,\n                    "_run_gemma_fallback",\n                    return_value=(None, "gemma unavailable"),\n                )\n            )\n            patches.append(patch.object(_mod, "run_d14_fallback", return_value=result))\n'''
          if old not in text:
              raise SystemExit('Low-band D14 mock anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Update GPT-OSS dry-run expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/gemma_code_review_test.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('    def test_dry_run_think_false_by_default')
          if start < 0:
              raise SystemExit('dry-run think test anchor not found')
          end = text.find('\n    def ', start + 5)
          if end < 0:
              end = len(text)
          block = text[start:end]
          old = '        self.assertFalse(payload["think"])'
          if old not in block:
              raise SystemExit('legacy think=False assertion not found in dry-run test')
          block = block.replace(old, '        self.assertEqual(payload["think"], "medium")', 1)
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile \
            scripts/gemma_local.py \
            scripts/gemma-code-review.py \
            scripts/peer-workflow-review.py \
            scripts/local-architect/run_analysis.py \
            scripts/reviewer_model_binding_test.py
          python scripts/reviewer_model_binding_test.py
          python scripts/gemma_local_test.py
          python scripts/peer_workflow_review_test.py
          python scripts/gemma_code_review_test.py
          python scripts/gemma_review_makefile_test.py
          python scripts/gemma_push_review_test.py
          python scripts/local-architect/run_analysis_test.py
          python scripts/local-architect/adr037_handoff_mapping_test.py
          ! grep -RniE 'muse[- _]glimmer' scripts Makefile docs/playbooks/AGENT_WORKFLOW_GUIDE.md

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: retire Muse from active local model stack [model-stack-migration]"
          git push origin HEAD:feat/devstral-128k-migration
