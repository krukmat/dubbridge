name: T6c Native AMD64 Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: registry.digitalocean.com/dubbridge

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify native amd64 runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          echo "T6C_RUNNER_ARCH=amd64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install and authenticate doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Authenticate to DigitalOcean Container Registry
        shell: bash
        run: |
          set -euo pipefail
          doctl registries login dubbridge \
            --expiry-seconds 1800

      - name: Build and publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          make do-release \
            REV="$(git rev-parse HEAD)" \
            REGISTRY="${REGISTRY}"

      - name: Verify release manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find artifacts/releases -name release.json -type f -print -quit)"
          test -n "${manifest}"
          ./scripts/verify-release-manifest.sh "${manifest}"
          echo "T6C_RELEASE_MANIFEST=${manifest}"

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: t6c-release-${{ github.sha }}
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 30
