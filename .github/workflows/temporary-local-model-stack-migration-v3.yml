name: Temporary local model stack migration v3

on:
  push:
    branches:
      - feat/devstral-128k-migration

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[model-stack-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/devstral-128k-migration
          fetch-depth: 0

      - name: Apply role migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          MUSE_TAG = "muse-glimmer:30b-q4_K_M"
          GPT_TAG = "gpt-oss:20b"
          QWEN_TAG = "qwen3.6:27b-q4_K_M"
          QWEN_DIGEST = "3a40c32f1450b8380412898385b0e00df5d6d2d801dd192ca1acb7e735cd050e"
          OLD_MUSE_DIGEST = "de878ce33ad81d060001db1469a02eebe4d86f0ad58cfe52dc062fdcbe4464c1"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def require(text, needle, path):
              if needle not in text:
                  raise SystemExit(f"{path}: missing anchor {needle!r}")

          def retire_muse_text(text):
              text = text.replace(MUSE_TAG, GPT_TAG)
              text = text.replace("muse_glimmer", "gpt_oss")
              text = text.replace("Muse Glimmer", "GPT-OSS 20B")
              text = text.replace("Muse-Glimmer", "GPT-OSS")
              text = text.replace("muse-glimmer", "gpt-oss")
              text = text.replace("muse glimmer", "gpt-oss")
              return text

          # Retire Muse from executable/config surfaces first.
          for root in (Path("scripts"), Path("Makefile")):
              paths = [root] if root.is_file() else [p for p in root.rglob("*") if p.is_file()]
              for path in paths:
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  path.write_text(retire_muse_text(text), encoding="utf-8")

          # Local Architect is Qwen3.6, never GPT-OSS.
          architect_paths = (
              "scripts/local-architect/run_analysis.py",
              "scripts/local-architect/run_analysis_test.py",
              "scripts/local-architect/adr037_handoff_mapping.py",
              "scripts/local-architect/adr037_handoff_mapping_test.py",
          )
          for path in architect_paths:
              text = read(path)
              text = text.replace(GPT_TAG, QWEN_TAG)
              text = text.replace("GPT-OSS 20B", "Qwen3.6 27B")
              text = text.replace("gpt-oss", "qwen3.6")
              text = text.replace(OLD_MUSE_DIGEST, QWEN_DIGEST)
              write(path, text)

          # Shared Ollama transport: GPT-OSS reviewer profile.
          path = "scripts/gemma_local.py"
          text = read(path)
          require(text, f'DEFAULT_REVIEW_MODEL = "{GPT_TAG}"', path)
          if "DEFAULT_REVIEW_NUM_CTX" not in text:
              text = text.replace(
                  f'DEFAULT_REVIEW_MODEL = "{GPT_TAG}"\n',
                  f'DEFAULT_REVIEW_MODEL = "{GPT_TAG}"\n'
                  'DEFAULT_REVIEW_NUM_CTX = 65536\n'
                  'DEFAULT_REVIEW_REASONING_EFFORT = "medium"\n',
                  1,
              )
          c4_start = text.find("# C4 (")
          c4_end_marker = 'THINK_DIRECTIVE_TEXT = "/no_think"\n'
          if c4_start >= 0:
              c4_end = text.find(c4_end_marker, c4_start)
              if c4_end < 0:
                  raise SystemExit(f"{path}: malformed legacy think-directive block")
              c4_end += len(c4_end_marker)
              text = (
                  text[:c4_start]
                  + '# GPT-OSS uses Ollama native reasoning levels; the retired model-specific /no_think workaround is disabled.\n'
                  + 'GPT_OSS_MODEL_PREFIX = "gpt-oss"\n'
                  + 'GPT_OSS_REASONING_LEVELS = {"low", "medium", "high"}\n'
                  + 'THINK_DIRECTIVE_MODELS = set()\n'
                  + 'THINK_DIRECTIVE_TEXT = "/no_think"\n'
                  + text[c4_end:]
              )
          elif "GPT_OSS_MODEL_PREFIX" not in text:
              raise SystemExit(f"{path}: legacy thinking block not found")

          anchor = '''def resolve_num_predict(model, num_predict):\n    """Return the effective generation budget for a specific model.\n\n    Callers that pass a non-default value keep that explicit override. The\n    shared 4096-token default stays unchanged for models without an override.\n    """\n    if num_predict != DEFAULT_NUM_PREDICT:\n        return num_predict\n    return MODEL_NUM_PREDICT_OVERRIDES.get(model, DEFAULT_NUM_PREDICT)\n'''
          require(text, anchor, path)
          if "def resolve_think_setting(" not in text:
              text = text.replace(
                  anchor,
                  anchor
                  + '''\n\ndef resolve_think_setting(model, think):\n    """Resolve Ollama thinking control without invalid GPT-OSS booleans."""\n    if isinstance(model, str) and model.startswith(GPT_OSS_MODEL_PREFIX):\n        if isinstance(think, str) and think in GPT_OSS_REASONING_LEVELS:\n            return think\n        return DEFAULT_REVIEW_REASONING_EFFORT\n    return think\n\n\ndef resolve_keep_alive(model):\n    """Avoid long GPT-OSS residency on the 32 GB target host."""\n    if isinstance(model, str) and model.startswith(GPT_OSS_MODEL_PREFIX):\n        return "1m"\n    return "10m"\n''',
                  1,
              )
          text = text.replace('"think": think,', '"think": resolve_think_setting(model, think),', 1)
          text = text.replace('"keep_alive": "10m",', '"keep_alive": resolve_keep_alive(model),', 1)

          get_json_anchor = '''def get_json(url, timeout):\n    request = urllib.request.Request(url, method="GET")\n    try:\n        with urllib.request.urlopen(request, timeout=timeout) as response:\n            return json.loads(response.read().decode("utf-8"))\n    except (TimeoutError, socket.timeout) as exc:\n        raise GemmaIdleTimeout(timeout) from exc\n'''
          require(text, get_json_anchor, path)
          if "def unload_model(" not in text:
              text = text.replace(
                  get_json_anchor,
                  get_json_anchor
                  + '''\n\ndef unload_model(host, model, timeout):\n    """Best-effort unload of one Ollama model before a large-model role switch."""\n    try:\n        payload = get_json(endpoint(host, "/api/ps"), timeout)\n        loaded = {\n            item.get("name") or item.get("model")\n            for item in payload.get("models", [])\n            if isinstance(item, dict)\n        }\n        if model not in loaded:\n            return False\n        data = json.dumps({"model": model, "keep_alive": 0, "stream": False}).encode("utf-8")\n        req = urllib.request.Request(\n            endpoint(host, "/api/generate"),\n            data=data,\n            headers={"Content-Type": "application/json"},\n            method="POST",\n        )\n        with urllib.request.urlopen(req, timeout=timeout) as response:\n            response.read()\n        return True\n    except Exception as exc:\n        print(f"[local-model] warning: could not unload {model!r}: {exc}", file=sys.stderr)\n        return False\n''',
                  1,
              )
          write(path, text)

          # Update shared-helper tests to native GPT-OSS reasoning semantics.
          path = "scripts/gemma_local_test.py"
          text = read(path)
          text = text.replace(
              '# ADR-036 Amendment 2 (T4b): DEFAULT_REVIEW_MODEL must be GPT-OSS 20B\n'
              '# Glimmer\'s own tag and must never clobber DEFAULT_MODEL/\n'
              '# DEFAULT_FALLBACK_MODEL, which stay Gemma for Gemma Developer.\n',
              '# Reviewer binding is GPT-OSS 20B and remains decoupled from the Gemma developer/fallback binding.\n',
          )
          start = text.find("    def test_think_directive_prepended_for_gpt_oss_when_think_false")
          end = text.find("\n\nclass ModelAvailability", start)
          if start < 0 or end < 0:
              raise SystemExit(f"{path}: legacy think tests not found")
          replacement = '''    def test_gpt_oss_false_resolves_to_medium_without_text_directive(self):\n        payload = gemma_local.build_chat_payload(\n            model="gpt-oss:20b",\n            system_prompt="system prompt",\n            packet="packet",\n            num_ctx=65536,\n            num_predict=2048,\n            temperature=0.0,\n            think=False,\n        )\n        self.assertEqual(payload["think"], "medium")\n        self.assertEqual(payload["messages"][0]["content"], "system prompt")\n        self.assertEqual(payload["keep_alive"], "1m")\n\n    def test_other_model_keeps_boolean_think_false(self):\n        payload = gemma_local.build_chat_payload(\n            model="gemma4:26b-a4b-it-qat",\n            system_prompt="system prompt",\n            packet="packet",\n            num_ctx=8192,\n            num_predict=2048,\n            temperature=0.1,\n            think=False,\n        )\n        self.assertFalse(payload["think"])\n        self.assertEqual(payload["messages"][0]["content"], "system prompt")\n        self.assertEqual(payload["keep_alive"], "10m")\n\n    def test_gpt_oss_explicit_high_reasoning_is_preserved(self):\n        payload = gemma_local.build_chat_payload(\n            model="gpt-oss:20b",\n            system_prompt="system prompt",\n            packet="packet",\n            num_ctx=65536,\n            num_predict=2048,\n            temperature=0.0,\n            think="high",\n        )\n        self.assertEqual(payload["think"], "high")\n        self.assertEqual(payload["messages"][0]["content"], "system prompt")\n'''
          text = text[:start] + replacement + text[end:]
          if 'self.assertEqual(gemma_local.DEFAULT_REVIEW_MODEL, "gpt-oss:20b")' not in text:
              raise SystemExit(f"{path}: review binding expectation was not migrated")
          write(path, text)

          # Generic review runner: GPT-OSS default, 64K, evidence-only findings.
          path = "scripts/gemma-code-review.py"
          text = read(path)
          text = text.replace("Run a read-only local Gemma code review over a pre-built packet.",
                              "Run a read-only local code review over a pre-built packet.")
          text = text.replace("Send a read-only code review packet to local Ollama/Gemma.",
                              "Send a read-only code review packet to a local Ollama reviewer.")
          text = text.replace("You are Gemma Reviewer for DubBridge. You are read-only.",
                              "You are DubBridge Reviewer. You are read-only and evidence-bound.")
          text = text.replace(
              "Review the supplied packet and diff. Do not approve, modify files, ",
              "Review only the supplied packet and diff. Every finding must cite supplied code evidence. "
              "Do not infer unseen files or behavior. If evidence is insufficient, omit the finding. "
              "Do not approve, modify files, ",
          )
          text = text.replace('str(gemma_local.DEFAULT_NUM_CTX)', 'str(gemma_local.DEFAULT_REVIEW_NUM_CTX)')
          write(path, text)

          # Band-routed peer reviewer.
          path = "scripts/peer-workflow-review.py"
          text = read(path)
          text = text.replace("Review the supplied diff and acceptance criteria for correctness, ",
                              "Review only the supplied diff and acceptance criteria for correctness, ")
          text = text.replace(
              '"fail-closed behavior, missing tests, and side effects.\\n"',
              '"fail-closed behavior, missing tests, and side effects. Every finding must be supported "\n'
              '        "by supplied code evidence; do not infer unseen files or behavior.\\n"',
          )

          # Replace the retired second-review function with GPT-OSS profile.
          fn_start = text.find("def _run_gpt_oss_fallback(")
          fn_end = text.find("\n\ndef run_qwen_band_review", fn_start)
          if fn_start < 0 or fn_end < 0:
              raise SystemExit(f"{path}: GPT-OSS fallback function anchor missing after Muse retirement")
          gpt_functions = '''def _run_gpt_oss_review(\n    packet: str, phase: str, args, *, unload_first_model: str | None = None\n) -> Tuple[Optional[dict], Optional[str]]:\n    """Run GPT-OSS 20B with the evidence-bound 64K/medium reviewer profile."""\n    review_args = argparse.Namespace(**vars(args))\n    review_args.num_ctx = gemma_local.DEFAULT_REVIEW_NUM_CTX\n    review_args.temperature = 0.0\n    review_args.think = gemma_local.DEFAULT_REVIEW_REASONING_EFFORT\n    if unload_first_model:\n        gemma_local.unload_model(args.host, unload_first_model, args.idle_timeout)\n    last_error = None\n    for _ in range(2):\n        try:\n            result = run_local_structured_review(\n                packet, phase, review_args,\n                model=gemma_local.DEFAULT_REVIEW_MODEL,\n                reviewer=gemma_local.DEFAULT_REVIEW_MODEL,\n            )\n        except (gemma_local.GemmaIdleTimeout, gemma_local.GemmaWallTimeout, RuntimeError) as exc:\n            last_error = str(exc)\n            gemma_local.unload_model(args.host, gemma_local.DEFAULT_REVIEW_MODEL, args.idle_timeout)\n            continue\n        gemma_local.unload_model(args.host, gemma_local.DEFAULT_REVIEW_MODEL, args.idle_timeout)\n        if result["verdict"] == "blocked":\n            last_error = "gpt-oss reviewer returned BLOCKED"\n            continue\n        return result, None\n    return None, last_error or "gpt-oss reviewer unavailable"\n\n\ndef _run_gpt_oss_fallback(packet: str, phase: str, args) -> Tuple[Optional[dict], Optional[str]]:\n    return _run_gpt_oss_review(packet, phase, args, unload_first_model=args.qwen_model)\n'''
          text = text[:fn_start] + gpt_functions + text[fn_end:]

          band_start = text.find("def run_qwen_band_review(")
          band_end = text.find("\n\n# ---------------------------------------------------------------------------\n# Cross-vendor", band_start)
          if band_start < 0 or band_end < 0:
              raise SystemExit(f"{path}: RRI 26-55 review function anchor missing")
          band_fn = '''def run_qwen_band_review(content: str, phase: str, args) -> dict:\n    packet = _build_peer_packet(phase, content, args.task_id)\n    primary_result, primary_error = _run_qwen_with_retry(packet, phase, args, args.qwen_model)\n    if primary_result is not None:\n        return primary_result\n\n    print(f"[peer-review] gemma (26-55 primary) second reviewer triggered: {primary_error}", file=sys.stderr)\n    second_result, second_error = _run_gpt_oss_fallback(packet, phase, args)\n    if second_result is not None:\n        return second_result\n\n    print(f"[peer-review] gpt-oss second reviewer failed: {second_error}", file=sys.stderr)\n    d14_result = run_d14_fallback(packet, phase, DEFAULT_QWEN_REVIEW_MODEL)\n    d14_result["summary"] = (\n        f"gemma (26-55 primary) unavailable/invalid ({primary_error}); "\n        f"gpt-oss unavailable/invalid ({second_error}); D14 adjudication required."\n    )\n    return d14_result\n'''
          text = text[:band_start] + band_fn + text[band_end:]

          # Gemma fallback has its own env; DUBBRIDGE_REVIEW_MODEL is now the GPT-OSS reviewer role.
          text = text.replace(
              'default=os.environ.get(\n            "DUBBRIDGE_REVIEW_MODEL",\n            os.environ.get("DUBBRIDGE_LOW_RRI_MODEL", gemma_local.DEFAULT_MODEL),\n        ),',
              'default=os.environ.get(\n            "DUBBRIDGE_GEMMA_REVIEW_MODEL",\n            os.environ.get("DUBBRIDGE_LOW_RRI_MODEL", gemma_local.DEFAULT_MODEL),\n        ),',
              1,
          )
          text = text.replace('peer = resolve_peer(args.caller) if cross_vendor else (DEFAULT_QWEN_REVIEW_MODEL if qwen_band else "gemma")',
                              'peer = resolve_peer(args.caller) if cross_vendor else (DEFAULT_QWEN_REVIEW_MODEL if qwen_band else gemma_local.DEFAULT_REVIEW_MODEL)', 1)

          low_start = text.find("    # Gemma band (RRI 0-25).")
          low_end = text.find("\n\n    write_artifact(result, artifact)", low_start)
          if low_start < 0 or low_end < 0:
              raise SystemExit(f"{path}: Low-band main route anchor missing")
          low_route = '''    # Low band (RRI 0-25): GPT-OSS primary -> Gemma fallback -> D14.\n    packet = _build_peer_packet(args.phase, content, args.task_id)\n    result, gpt_error = _run_gpt_oss_review(packet, args.phase, args)\n    if result is None:\n        result, gemma_error = _run_gemma_fallback(content, args.phase, args)\n        if result is None:\n            d14_result = run_d14_fallback(packet, args.phase, gemma_local.DEFAULT_REVIEW_MODEL)\n            d14_result["summary"] = (\n                f"gpt-oss unavailable/invalid ({gpt_error}); "\n                f"Gemma unavailable/invalid ({gemma_error}); D14 adjudication required."\n            )\n            return handle_d14_fallback(d14_result, args, artifact)\n'''
          text = text[:low_start] + low_route + text[low_end:]
          write(path, text)

          # Focused reviewer binding/routing tests.
          Path("scripts/reviewer_model_binding_test.py").write_text('''import importlib.util\nimport os\nimport sys\nimport unittest\nfrom unittest.mock import MagicMock, patch\n\nSCRIPTS = os.path.dirname(os.path.abspath(__file__))\nif SCRIPTS not in sys.path:\n    sys.path.insert(0, SCRIPTS)\nimport gemma_local\n\nPEER = os.path.join(SCRIPTS, "peer-workflow-review.py")\nspec = importlib.util.spec_from_file_location("peer_workflow_review_binding", PEER)\npeer = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(peer)\n\nclass ReviewerBindingTest(unittest.TestCase):\n    def test_gpt_oss_profile(self):\n        self.assertEqual(gemma_local.DEFAULT_REVIEW_MODEL, "gpt-oss:20b")\n        self.assertEqual(gemma_local.DEFAULT_REVIEW_NUM_CTX, 65536)\n        self.assertEqual(gemma_local.DEFAULT_REVIEW_REASONING_EFFORT, "medium")\n        payload = gemma_local.build_chat_payload(\n            model="gpt-oss:20b", system_prompt="s", packet="p",\n            num_ctx=65536, num_predict=128, temperature=0.0, think=False,\n        )\n        self.assertEqual(payload["think"], "medium")\n        self.assertEqual(payload["keep_alive"], "1m")\n\n    def test_low_route_prefers_gpt_oss(self):\n        args = MagicMock(\n            task_id="T", host="http://localhost:11434", qwen_model="gemma4:26b-a4b-it-qat",\n            num_ctx=131072, num_predict=128, temperature=0.1, think=False,\n            idle_timeout=60, max_wall=60,\n        )\n        expected = {"reviewer": "gpt-oss:20b", "verdict": "pass", "summary": "ok", "findings": []}\n        with patch.object(peer, "_run_gpt_oss_review", return_value=(expected, None)) as gpt, \\\n             patch.object(peer, "_run_gemma_fallback") as gemma:\n            result, error = peer._run_gpt_oss_review("packet", "code", args)\n        self.assertEqual(result["reviewer"], "gpt-oss:20b")\n        self.assertIsNone(error)\n        gemma.assert_not_called()\n\n    def test_moderate_second_reviewer_function_is_gpt_oss(self):\n        self.assertTrue(hasattr(peer, "_run_gpt_oss_fallback"))\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding="utf-8")

          # Local Architect Qwen3.6 exact binding and 64K runtime profile.
          path = "scripts/local-architect/run_analysis.py"
          text = read(path)
          text = text.replace(
              '# ADR-037 Amendment 1 (T4b): the Local Architect / Complex Analyst\n'
              '# binding moved from qwen3.6:27b-q4_K_M (reassigned to the local\n'
              '# implementer by ADR-036 Amendment 2) to Qwen3.6 27B.\n',
              '# ADR-044: Local Architect / Complex Analyst is bound to Qwen3.6 27B Q4_K_M.\n',
          )
          text = text.replace('_BOUNDARY_BUDGET_NUM_CTX = 8192', '_BOUNDARY_BUDGET_NUM_CTX = 65536')
          text = text.replace('default="qwen3.6:27b-q4_K_M",', 'default="qwen3.6:27b-q4_K_M",', 1)
          text = re.sub(
              r'default="[0-9a-f]{64}",\n        help="Expected Ollama digest for the exact model tag\."',
              f'default="{QWEN_DIGEST}",\n        help="Expected Ollama digest for the exact model tag."',
              text,
              count=1,
          )
          text = text.replace('default=8192,\n        help="Ollama context window size',
                              'default=65536,\n        help="Ollama context window size', 1)
          if '"keep_alive": 0,' not in text:
              text = text.replace('"stream": False,', '"stream": False,\n        "keep_alive": 0,', 1)
          write(path, text)

          path = "scripts/local-architect/run_analysis_test.py"
          text = read(path).replace(OLD_MUSE_DIGEST, QWEN_DIGEST)
          text = text.replace('self.assertEqual(config.num_ctx, 8192)', 'self.assertEqual(config.num_ctx, 65536)')
          write(path, text)

          # Authoritative active guide.
          path = "docs/playbooks/AGENT_WORKFLOW_GUIDE.md"
          text = retire_muse_text(read(path))
          text = text.replace(f'| Local Architect / Complex Analyst | `{GPT_TAG}`', f'| Local Architect / Complex Analyst | `{QWEN_TAG}`')
          text = text.replace("GPT-OSS 20B advisory refinement", "Qwen3.6 27B advisory refinement")
          text = text.replace("GPT-OSS advisory refinement", "Qwen3.6 27B advisory refinement")
          text = text.replace("GPT-OSS 20B advisory-only", "Qwen3.6 27B advisory-only")
          if re.search(r"muse[- _]glimmer", text, re.I):
              raise SystemExit(f"{path}: Muse survived active guide")
          write(path, text)

          # Append-only history + explicit new ADR.
          path = "docs/audit/agent-workflow-binding-history.md"
          text = read(path)
          row = ('| 2026-08-31 | Active local stack rebinding | Reviewer slots previously held by Muse Glimmer -> '
                 '`gpt-oss:20b` (64K, medium reasoning); Local Architect / Complex Analyst -> '
                 '`qwen3.6:27b-q4_K_M` (64K, think=false). Muse Glimmer retired from the active stack; historical rows retained. |\n')
          if row not in text:
              text += ("" if text.endswith("\n") else "\n") + row
          write(path, text)

          adr = Path("docs/adr/ADR-044-local-model-reviewer-and-architect-rebinding.md")
          if not adr.exists():
              adr.write_text(f'''---\ntype: ADR\nstatus: Accepted\ndate: 2026-08-31\n---\n\n# ADR-044 — Local reviewer and architect rebinding\n\n## Decision\n\nRetire Muse Glimmer from every active DubBridge role. Historical ADR/audit references remain as historical truth.\n\n- RRI 0–25 implementer remains `qwen3.8:27b-mlx`.\n- RRI 26–45 local implementer remains `devstral-small-2:24b-instruct-2512-q4_K_M`.\n- Low review is `gpt-oss:20b` -> Gemma -> D14.\n- RRI 26–55 review is Gemma -> `gpt-oss:20b` -> D14.\n- GPT-OSS uses 64K context and medium reasoning; second-review temperature is 0 and findings are evidence-bound.\n- Local Architect / Complex Analyst uses `{QWEN_TAG}` with 64K context, temperature 0, `think=false`, `keep_alive=0`, digest `{QWEN_DIGEST}`.\n- Reviewer role switches explicitly unload the prior large model and release GPT-OSS after its attempt to minimize simultaneous residency on the 32 GB target host.\n\n## Unchanged\n\nRRI boundaries, cloud escalation, D14 adjudication, implementation repair budgets, reviewer independence requirements, and Devstral/Qwen3.8 implementation responsibilities remain unchanged.\n''', encoding="utf-8")

          path = "docs/adr/README.md"
          text = read(path)
          entry = '- [ADR-044 — Local reviewer and architect rebinding](ADR-044-local-model-reviewer-and-architect-rebinding.md) — Accepted 2026-08-31\n'
          if "ADR-044-local-model-reviewer-and-architect-rebinding.md" not in text:
              text += ("" if text.endswith("\n") else "\n") + entry
          write(path, text)

          # Fail closed: Muse must not remain in current executable/config/authoritative surfaces.
          survivors = []
          for root in (Path("scripts"), Path("Makefile"), Path("docs/playbooks/AGENT_WORKFLOW_GUIDE.md")):
              paths = [root] if root.is_file() else [p for p in root.rglob("*") if p.is_file()]
              for file in paths:
                  try:
                      data = file.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if re.search(r"muse[- _]glimmer", data, re.I):
                      survivors.append(str(file))
          if survivors:
              raise SystemExit("Active Muse references remain: " + ", ".join(sorted(set(survivors))))
          PY

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile \
            scripts/gemma_local.py \
            scripts/gemma-code-review.py \
            scripts/peer-workflow-review.py \
            scripts/local-architect/run_analysis.py \
            scripts/reviewer_model_binding_test.py
          python scripts/reviewer_model_binding_test.py
          python scripts/gemma_local_test.py
          python scripts/peer_workflow_review_test.py
          python scripts/gemma_code_review_test.py
          python scripts/gemma_review_makefile_test.py
          python scripts/gemma_push_review_test.py
          python scripts/local-architect/run_analysis_test.py
