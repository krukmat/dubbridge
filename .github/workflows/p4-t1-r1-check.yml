name: p4-t1-r1-check

on:
  push:
    branches:
      - feature/p2p-mvp-core
    paths:
      - ".github/workflows/p4-t1-r1-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Check committed Bare worklet
        run: npm run check:bare-worklet
        working-directory: mobile
      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p4-t1-r1-check.yml
          git commit -m "ci(p4): remove T1-r1 one-shot check"
          git push origin HEAD:feature/p2p-mvp-core
