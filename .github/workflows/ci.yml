name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'

env:
  CARGO_NET_RETRY: 5

jobs:
  qa-docs:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run docs consistency gate
        run: make qa-docs

  roadmap-drift:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject roadmap done-state drift
        run: make qa-roadmap-drift

  fmt:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt gate
        run: make qa-fmt

  clippy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy gate
        run: make qa-lint

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dubbridge_test
          POSTGRES_USER: dubbridge
          POSTGRES_PASSWORD: dubbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DUBBRIDGE_DATABASE_URL: postgresql://dubbridge:dubbridge@localhost:5432/dubbridge_test
      DUBBRIDGE_REDIS_URL: redis://127.0.0.1:6379/15
      DUBBRIDGE_P2P_KEK_ID: p3-t3-ci-kek
      DUBBRIDGE_P2P_KEK_VERSION: "1"
      DUBBRIDGE_P2P_KEK_HEX: "0303030303030303030303030303030303030303030303030303030303030303"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prefetch workspace dependencies
        run: cargo fetch --locked
      - name: Run workspace tests
        run: make qa-test
      - name: Run P2P preflight pipeline regression
        run: make qa-p2p-preflight
      - name: Probe Redis test service
        run: |
          python3 - <<'PY'
          import socket
          conn = socket.create_connection(("127.0.0.1", 6379), timeout=5)
          conn.sendall(b"*1\r\n$4\r\nPING\r\n")
          reply = conn.recv(16)
          conn.close()
          if not reply.startswith(b"+PONG"):
              raise SystemExit(f"unexpected redis reply: {reply!r}")
          PY
      - name: Run Redis integration tests
        run: make qa-test-redis

  s3-integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      DUBBRIDGE_STORAGE_TEST_ENDPOINT: http://127.0.0.1:9000
      DUBBRIDGE_STORAGE_TEST_ACCESS_KEY_ID: dubbridge
      DUBBRIDGE_STORAGE_TEST_SECRET_ACCESS_KEY: dubbridge-minio-ci
      DUBBRIDGE_STORAGE_TEST_BUCKET: dubbridge-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO S3 test service
        run: |
          docker run -d --name dubbridge-minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=dubbridge \
            -e MINIO_ROOT_PASSWORD=dubbridge-minio-ci \
            ghcr.io/coollabsio/minio:2025-04-22t22-12-26z@sha256:d8cfccee3f7bf0182d89c223b2ff53b94c9a88237bc0dd5733dd49fa0f4dab4c \
            server /data
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs dubbridge-minio-ci
          exit 1
      - name: Create S3 integration-test bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh \
            ghcr.io/coollabsio/minio:2025-04-22t22-12-26z@sha256:d8cfccee3f7bf0182d89c223b2ff53b94c9a88237bc0dd5733dd49fa0f4dab4c \
            -ec '/usr/bin/mc alias set ci http://127.0.0.1:9000 dubbridge dubbridge-minio-ci && /usr/bin/mc mb --ignore-existing ci/dubbridge-ci'
      - name: Run mandatory S3 integration test
        run: make qa-test-s3
      - name: Stop MinIO S3 test service
        if: always()
        run: docker rm -f dubbridge-minio-ci >/dev/null 2>&1 || true

  cargo-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: make qa-check

  maintainability:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      DUBBRIDGE_MAINTAINABILITY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject generated-code bloat in backend/mobile diffs
        run: make qa-maintainability

  python-complexity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.16.5
      - name: Enforce Python worker complexity and length bounds
        run: make qa-python-complexity PYTHON=python

  mobile:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile
      - name: Run mobile gate (strict types + lint + tests)
        run: make qa-mobile
      - name: Verify P3 T2c3 local certification harness
        run: bash scripts/p3-t2c3-certify-android.sh --self-check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.4 --locked
      - name: Run dependency policy gate
        run: make qa-deny

  config-secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed secrets in config profiles
        run: make qa-config-secrets
      - name: Verify P3 T3c secret boundary
        run: python3 scripts/p3-t3c-secret-boundary.py

  coverage:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dubbridge_test
          POSTGRES_USER: dubbridge
          POSTGRES_PASSWORD: dubbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DUBBRIDGE_DATABASE_URL: postgresql://dubbridge:dubbridge@localhost:5432/dubbridge_test
      DUBBRIDGE_P2P_KEK_ID: p3-t3-ci-kek
      DUBBRIDGE_P2P_KEK_VERSION: "1"
      DUBBRIDGE_P2P_KEK_HEX: "0303030303030303030303030303030303030303030303030303030303030303"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.13 --locked
      - name: Enforce 90% line coverage
        run: make qa-coverage

  release-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run release build gate
        run: make qa-build-release

  peer-workflow-review:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run peer-workflow-review unit tests
        run: python3 scripts/peer_workflow_review_test.py
      - name: Smoke-test peer-workflow routing (dry-run)
        env:
          PEER_REVIEW_DRY_RUN: "1"
          PEER_REVIEW_RRI: ${{ github.event_name == 'pull_request' && '22' || '22' }}
          PEER_REVIEW_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
        run: make qa-peer-workflow-review
