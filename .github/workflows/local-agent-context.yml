name: local-agent-context

on:
  push:
    paths:
      - 'scripts/local-agent/**'
      - 'scripts/gemma_local.py'
      - '.cbmignore'
      - 'docs/schemas/ckg-context-manifest-v1.yaml'
      - '.github/workflows/local-agent-context.yml'
  pull_request:
    paths:
      - 'scripts/local-agent/**'
      - 'scripts/gemma_local.py'
      - '.cbmignore'
      - 'docs/schemas/ckg-context-manifest-v1.yaml'
      - '.github/workflows/local-agent-context.yml'

jobs:
  local-agent-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run context-provider tests
        run: python3 scripts/local-agent/context_provider_test.py
      - name: Run prompt-builder regression tests
        run: python3 scripts/local-agent/prompt_builder_test.py
      - name: Run local-agent integration tests
        run: python3 scripts/local-agent/integration_test.py
      - name: Run full local-runner regression suite
        run: python3 scripts/local-agent/run_local_task_test.py
