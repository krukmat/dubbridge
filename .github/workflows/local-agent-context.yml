name: local-agent-context

on:
  push:
    paths:
      - 'scripts/local-agent/**'
      - '.cbmignore'
      - 'docs/schemas/ckg-context-manifest-v1.yaml'
      - '.github/workflows/local-agent-context.yml'
  pull_request:
    paths:
      - 'scripts/local-agent/**'
      - '.cbmignore'
      - 'docs/schemas/ckg-context-manifest-v1.yaml'
      - '.github/workflows/local-agent-context.yml'

jobs:
  context-provider-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run local-agent context provider tests
        run: python3 scripts/local-agent/context_provider_test.py
